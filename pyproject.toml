[project]
name = "python-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "openai-agents>=0.22.2",
    "python-dotenv>=1.2.1",
]

[project.scripts]
python-ai-agent = "python_ai_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
